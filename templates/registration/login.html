{% extends 'base.html' %}

{% block title %}Login - Chores Tracker{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <div class="card">
        <h2 style="margin-bottom: 1.5rem; text-align: center; color: var(--primary-color);">Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
            Don't have an account? <a href="{% url 'register' %}" style="color: var(--primary-color);">Register</a>
        </p>
    </div>
</div>
{% endblock %}
